[package]
name = "decide-napi"
version = "0.1.0"
edition = "2021"
description = "Node.js bindings for decide-core"
license = "MIT"
repository = "https://github.com/syedsohailhussain1/gavel"
keywords = ["decision", "classification", "calibration", "agents", "napi"]

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi8"] }
napi-derive = "2"
serde_json = "1"
decide-core = { path = "../decide-core" }

[build-dependencies]
napi-build = "2"
